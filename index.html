<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BiyoLab: Canlıların Ortak Özellikleri</title>
<style>
:root{--g:#39ff88;--b:#29d9ff;--r:#ff4d6d;--y:#ffd166;--t:#e8f4ff;--glass:rgba(255,255,255,.07);--bd:rgba(255,255,255,.16)}
*{box-sizing:border-box;margin:0;padding:0}
body{min-height:100vh;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--t);background:radial-gradient(circle at 20% 15%,#0b3a4a 0,transparent 45%),radial-gradient(circle at 85% 80%,#0a4a2c 0,transparent 45%),#050b14;overflow-x:hidden}
.bub{position:fixed;border-radius:50%;border:1px solid rgba(41,217,255,.25);background:rgba(41,217,255,.05);animation:fl 14s linear infinite;pointer-events:none}
@keyframes fl{from{transform:translateY(105vh)}to{transform:translateY(-20vh)}}
#app{position:relative;z-index:2;max-width:980px;margin:0 auto;padding:16px}
.glass{background:var(--glass);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid var(--bd);border-radius:20px;padding:20px;box-shadow:0 8px 32px rgba(0,0,0,.4)}
.screen{display:none;animation:in .4s}.screen.on{display:block}
@keyframes in{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
h1{font-size:clamp(1.7rem,5vw,2.7rem);text-align:center;background:linear-gradient(90deg,var(--g),var(--b));-webkit-background-clip:text;background-clip:text;color:transparent;margin:6px 0}
h2{color:var(--b);margin-bottom:10px}
.sub{text-align:center;opacity:.8;margin-bottom:16px}
.logo{display:block;margin:0 auto;width:90px;height:90px}
button{font:inherit;color:var(--t);cursor:pointer}
.btn{background:linear-gradient(135deg,rgba(57,255,136,.25),rgba(41,217,255,.25));border:1px solid var(--g);border-radius:14px;padding:12px 18px;font-weight:700;transition:.2s;box-shadow:0 0 12px rgba(57,255,136,.25)}
.btn:hover{transform:translateY(-2px);box-shadow:0 0 22px rgba(57,255,136,.55)}
.btn.sm{padding:7px 12px;font-size:.85rem}
.menu{display:grid;gap:12px;margin-top:12px}
.mode{text-align:left;display:flex;gap:14px;align-items:center}
.mode b{display:block;font-size:1.1rem;color:var(--g)}.mode span{font-size:.88rem;opacity:.85;font-weight:400}
.num{min-width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:var(--b);color:#012;font-weight:800}
input{font:inherit;width:100%;padding:11px;border-radius:12px;border:1px solid var(--bd);background:rgba(0,0,0,.35);color:var(--t);margin:6px 0 12px}
.row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:14px}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.pill{background:rgba(0,0,0,.35);border:1px solid var(--bd);border-radius:99px;padding:6px 14px;font-weight:700}
.q{font-size:clamp(1.05rem,3.5vw,1.4rem);text-align:center;margin:14px 0;line-height:1.5}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.opt{background:var(--glass);border:1px solid var(--bd);border-radius:14px;padding:14px;font-weight:600;transition:.2s}
.opt:hover:not(:disabled){border-color:var(--b);box-shadow:0 0 14px rgba(41,217,255,.5)}
.opt.ok{background:rgba(57,255,136,.3);border-color:var(--g)}.opt.no{background:rgba(255,77,109,.3);border-color:var(--r)}
.bar{height:10px;border-radius:9px;background:rgba(255,255,255,.1);overflow:hidden}.bar i{display:block;height:100%;width:100%;background:linear-gradient(90deg,var(--g),var(--b))}
.bar.low i{background:var(--r)}
.fb{margin-top:12px;padding:12px;border-radius:12px;background:rgba(0,0,0,.35);border-left:4px solid var(--y);font-size:.95rem;display:none}
.match{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.col{display:flex;flex-direction:column;gap:8px}
.chip,.card{background:var(--glass);border:1px solid var(--bd);border-radius:12px;padding:10px;font-size:.9rem;transition:.2s;user-select:none}
.chip{cursor:grab}.chip.sel{border-color:var(--y);box-shadow:0 0 14px var(--y)}
.chip.done{border-color:var(--g);background:rgba(57,255,136,.18);opacity:.75;cursor:default}
.card{cursor:pointer;text-align:center;font-weight:700}.card:hover,.card.over{border-color:var(--b);box-shadow:0 0 14px var(--b)}
.card.flash{background:rgba(57,255,136,.4)}.shake{animation:sh .35s;border-color:var(--r)!important}
@keyframes sh{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.cards12{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:10px}
.info{background:rgba(0,0,0,.3);border-radius:14px;padding:12px;border:1px solid var(--bd);font-size:.9rem;line-height:1.45}.info b{color:var(--g)}
.miss{background:rgba(0,0,0,.3);border-left:4px solid var(--r);border-radius:12px;padding:12px;margin:10px 0;font-size:.92rem;line-height:1.5}
.miss .n{color:var(--y);margin-top:6px}
table{width:100%;border-collapse:collapse}th,td{padding:8px;text-align:left;border-bottom:1px solid var(--bd);font-size:.92rem}th{color:var(--b)}
.big{font-size:3rem;text-align:center;font-weight:800;color:var(--g);text-shadow:0 0 18px var(--g)}
#conf{position:fixed;inset:0;z-index:50;pointer-events:none}
#snd{position:fixed;top:12px;right:12px;z-index:60;width:44px;height:44px;border-radius:50%;background:var(--glass);border:1px solid var(--bd);backdrop-filter:blur(10px);font-size:1.2rem}
@media(max-width:600px){.opts,.match{grid-template-columns:1fr}.glass{padding:14px}#app{padding:10px}}
</style>
</head>

</div>

    b.onclick=function(){if(b.textContent===c.s[p]){b.disabled=true;b.classList.add("ok");SFX.click();p++;if(p===c.s.length)g4r(!bad,"Doğru sıra: "+c.s.join(" → "))}
      else{bad=true;b.classList.add("shake");setTimeout(function(){b.classList.remove("shake")},400);SFX.bad();addMiss(c.q,"Yanlış sıralama denemesi",c.s.join(" → "),"Basamaklar basitten karmaşığa doğru ilerler.")}};o.appendChild(b)})}
  else sh(c.o.map(function(_,i){return i})).forEach(function(i){var b=document.createElement("button");b.className="opt";b.textContent=c.o[i];b.dataset.i=i;
    b.onclick=function(){$$("#g4o .opt").forEach(function(x){x.disabled=true;if(+x.dataset.i===c.a)x.classList.add("ok");else if(+x.dataset.i===i)x.classList.add("no")});
      var ok=i===c.a;if(!ok)addMiss(c.q,c.o[i],c.o[c.a],c.n);g4r(ok,c.n)};o.appendChild(b)})}
function g4r(ok,note){
  S.total++;if(ok){S.score+=15;S.correct++;SFX.ok()}else if(!S.d[S.idx].s)SFX.bad();
  $("#g4s").textContent="Skor: "+S.score;var f=$("#g4f");f.style.display="block";f.innerHTML=(ok?"✅ Harika! ":"❌ Olmadı. ")+esc(note);
  var b=$("#g4n");b.style.display="inline-block";b.textContent=S.idx+1>=S.d.length?"Sonucu Gör":"Sonraki →";b.onclick=function(){S.idx++;g4n()}}

/* ---- Oyun sonu ---- */
function finish(total){
  clearInterval(timer);var tot=(S.mode===2||S.mode===5)?S.total:total,acc=tot?Math.round(S.correct/tot*100):0,good=acc>=70&&S.score>0;
  $("#etitle").textContent=MN[S.mode]+" · Oyun Bitti";$("#escore").textContent=S.score;
  var extra=(S.mode===2||S.mode===5)?" · En yüksek kombo: x"+S.max:"";
  var msg=acc>=90?"Mükemmel! Gerçek bir biyolog gibisin 🧬":acc>=70?"Harika iş çıkardın! 🎉":acc>=40?"Fena değil, hata analizine göz at 📖":"Bilgi Kartları'na bir bak ve tekrar dene 💪";
  $("#einfo").textContent="Doğruluk: %"+acc+" ("+S.correct+"/"+tot+")"+extra+" — "+msg;
  $("#emiss").innerHTML=S.miss.length?S.miss.map(function(m){return"<div class='miss'><b>"+esc(m.q)+"</b><br>❌ Senin cevabın: "+esc(m.p)+"<br>✅ Doğrusu: <b>"+esc(m.r)+"</b><div class='n'>👩‍🏫 Öğretmen Notu: "+esc(m.n)+"</div></div>"}).join(""):"<p class='sub'>Hiç yanlışın yok, tebrikler! 🏅</p>";
  var d=new Date();saveLB({n:getName(),m:MN[S.mode],s:S.score,d:d.toLocaleDateString("tr-TR")});
  show("end");if(good){confetti();SFX.win()}}
</script>
